# logger options
snapshot_save_iter: 5000
snapshot_val_iter: 1000
snapshot_log_iter: 10

# optimization options
max_iter: 100000
weight_decay: 0.0001
lr_gen: 0.0001
lr_dis: 0.0001
init: kaiming
w_adv_g: 1
w_adv_d: 1
w_recon: 0.2
w_cls: 1.0
w_gp: 10

# model options
model: DaGAN61
gen:
  nf: 32
  n_downs: 2
  norm: bn
  rate: 1
dis:
  nf: 64
  n_res_blks: 4
  num_classes: 16

# data options
dataset: dce
num_workers: 0
batch_size: 8
n_sample_train: 3
n_sample_val: 3
n_sample_test: 3
num_generate: 10
data_root: datasets/dce3.npy
